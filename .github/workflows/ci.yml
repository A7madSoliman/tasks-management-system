name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
